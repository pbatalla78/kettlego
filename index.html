<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>KettleGO!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;--bg2:#16213e;--text:#eee;--accent:#ff6b35;
  --accent2:#ffd166;--blue:#3a86ff;--red:#ef476f;--green:#06d6a0;
  --gray:#8d99ae;--text2:#c5ccd8;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;position:absolute;top:0;left:0}
.screen.active{display:flex}

.logo{margin-bottom:10px}
.logo svg{width:80px;height:80px}
.app-title{font-size:2.4rem;font-weight:900;letter-spacing:2px;color:var(--accent);margin-bottom:5px}
.app-subtitle{font-size:0.95rem;color:var(--gray);margin-bottom:30px}

.wheel-container{position:relative;width:240px;height:240px;margin-bottom:30px}
.wheel-track{width:240px;height:240px;border-radius:50%;border:6px solid var(--bg2);position:relative}
.wheel-progress{position:absolute;top:0;left:0;width:240px;height:240px}
.wheel-progress circle{fill:none;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .15s ease}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.wheel-minutes{font-size:4rem;font-weight:900;color:var(--accent);line-height:1}
.wheel-label{font-size:.85rem;color:var(--gray);margin-top:2px}
.wheel-controls{display:flex;gap:20px;margin-bottom:30px}
.wheel-btn{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:1.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wheel-btn:active{background:var(--accent);color:var(--bg)}

.btn-go{width:180px;height:56px;border-radius:28px;border:none;background:linear-gradient(135deg,var(--accent),#ff8c42);color:#fff;font-size:1.4rem;font-weight:900;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.4);transition:transform .1s}
.btn-go:active{transform:scale(.95)}

.exercise-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 5px;margin-bottom:6px}
.exercise-progress-text{font-size:1rem;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.btn-pause{width:44px;height:44px;border-radius:50%;border:2px solid var(--gray);background:transparent;color:var(--gray);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-pause:active{border-color:var(--accent);color:var(--accent)}

.progress-bar-container{width:100%;height:4px;background:var(--bg2);border-radius:2px;margin-bottom:10px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);transition:width .3s ease;border-radius:2px}

.exercise-illustration{width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden}
.exercise-illustration img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.exercise-illustration svg{width:100%;max-width:200px;max-height:100%}
.exercise-illustration.resting{opacity:.5;transition:opacity .3s}

.exercise-name{font-size:1.6rem;line-height:1.15;font-weight:800;margin:6px 0 2px;text-align:center;min-height:1.8em;display:flex;align-items:center;justify-content:center}
.exercise-desc{font-size:.95rem;color:var(--text2);text-align:center;min-height:1.3em;margin-bottom:4px;padding:0 12px;line-height:1.4;max-width:520px}
.side-indicator{font-size:1.1rem;font-weight:700;min-height:1.4em;margin-bottom:4px;transition:opacity .3s}
.side-indicator.blue{color:var(--blue)}
.side-indicator.red{color:var(--red)}
.side-indicator.change{color:var(--accent2);font-size:1.15rem;font-weight:800;animation:pulse .5s ease infinite alternate}
.side-indicator.prepare{color:var(--accent2);font-size:1.15rem;font-weight:800;letter-spacing:1px}
.header-actions{display:flex;gap:8px}
.player-controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:6px}
.btn-skip{width:56px;height:56px;border-radius:50%;border:2px solid var(--text2);background:transparent;color:var(--text2);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-skip:active{border-color:var(--accent);color:var(--accent)}
.btn-skip span{font-size:.7rem;display:block}
.timer-ring-container.small{margin:0}

/* Preview */
#previewScreen{justify-content:flex-start;padding:16px}
.preview-top{width:100%;max-width:560px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.btn-back{width:44px;height:44px;border-radius:50%;border:2px solid var(--text2);background:transparent;color:var(--text2);font-size:1.3rem;cursor:pointer;flex-shrink:0}
.preview-title{font-size:1.5rem;font-weight:900;color:var(--accent)}
.preview-summary{width:100%;max-width:560px;color:var(--text2);font-size:1rem;margin-bottom:12px}
.preview-list{width:100%;max-width:560px;flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.preview-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:12px;padding:8px 10px}
.preview-thumb{width:56px;height:56px;border-radius:8px;background:#fff;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-thumb img{width:100%;height:100%;object-fit:cover}
.preview-thumb svg{width:100%;height:100%;background:var(--bg)}
.preview-info{flex:1;min-width:0}
.preview-name{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-meta{font-size:.9rem;color:var(--text2)}
.preview-item.rest{background:transparent;border:1px dashed var(--green);justify-content:center;color:var(--green);font-weight:700;padding:10px}
.btn-swap{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:var(--accent2);font-size:1.4rem;cursor:pointer;flex-shrink:0}
.btn-swap:disabled{opacity:.3}
.preview-actions{width:100%;max-width:560px;display:flex;gap:12px;justify-content:center;padding-top:10px}
.btn-secondary{height:56px;padding:0 20px;border-radius:28px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:1.05rem;font-weight:700;cursor:pointer}
.btn-secondary:active{background:var(--accent);color:#fff}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:10px;margin-right:6px;color:var(--bg)}
.tag.lower{background:var(--blue)}.tag.upper{background:var(--accent)}.tag.core{background:var(--green)}

@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}

.timer-ring-container{position:relative;width:150px;height:150px;margin:2px 0 10px}
.timer-ring{width:150px;height:150px}
.timer-ring-bg{fill:none;stroke:var(--bg2);stroke-width:8}
.timer-ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .3s}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.8rem;font-weight:900;font-variant-numeric:tabular-nums}

.rest-label{font-size:1.3rem;color:var(--green);font-weight:700;margin-bottom:5px}

.finish-trophy{font-size:5rem;margin-bottom:15px}
.finish-text{font-size:1.8rem;font-weight:900;color:var(--accent2);text-align:center;margin-bottom:10px}
.finish-stats{font-size:1.05rem;color:var(--text2);text-align:center;margin-bottom:30px;line-height:1.6}
.btn-restart{width:180px;height:50px;border-radius:25px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-restart:active{background:var(--accent);color:#fff}

.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.confetti{position:absolute;width:10px;height:10px;opacity:.9}

.pause-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,.92);z-index:20;flex-direction:column;align-items:center;justify-content:center}
.pause-overlay.active{display:flex}
.pause-title{font-size:1.8rem;font-weight:800;color:var(--accent2);margin-bottom:30px}
.btn-resume{width:180px;height:56px;border-radius:28px;border:none;background:linear-gradient(135deg,var(--green),#0abf8a);color:#fff;font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(6,214,160,.3)}
.btn-resume:active{transform:scale(.95)}
.btn-quit{margin-top:15px;background:none;border:none;color:var(--text2);font-size:1rem;padding:10px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
  <div class="logo">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="62" rx="22" ry="26" fill="var(--accent)"/>
      <ellipse cx="50" cy="59" rx="16" ry="20" fill="var(--bg)"/>
      <ellipse cx="50" cy="64" rx="14" ry="18" fill="var(--accent)"/>
      <path d="M40 38 Q50 22 60 38" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M44 30 Q50 16 56 30" stroke="var(--accent2)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="app-title">KettleGO!</div>
  <div class="app-subtitle">Tu entreno con kettlebell</div>
  <div class="wheel-container">
    <div class="wheel-track">
      <svg class="wheel-progress" viewBox="0 0 240 240">
        <circle id="wheelCircle" cx="120" cy="120" r="114" stroke="var(--accent)" stroke-dasharray="716.28" stroke-dashoffset="716.28"/>
      </svg>
    </div>
    <div class="wheel-center">
      <div class="wheel-minutes" id="minutesDisplay">10</div>
      <div class="wheel-label">minutos</div>
    </div>
  </div>
  <div class="wheel-controls">
    <button class="wheel-btn" id="btnMinus" aria-label="Menos minutos">-</button>
    <button class="wheel-btn" id="btnPlus" aria-label="Más minutos">+</button>
  </div>
  <button class="btn-go" id="btnGo">GO!</button>
</div>

<div id="exerciseScreen" class="screen">
  <div class="exercise-header">
    <span class="exercise-progress-text" id="progressText">1 / 12</span>
    <div class="header-actions">
      <button class="btn-pause" id="btnSound" aria-label="Sonido">&#128266;</button>
      <button class="btn-pause" id="btnPause" aria-label="Pausar">&#10074;&#10074;</button>
    </div>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="exercise-illustration" id="exerciseIllustration"></div>
  <div class="exercise-name" id="exerciseName"></div>
  <div class="exercise-desc" id="exerciseDesc"></div>
  <div class="side-indicator" id="sideIndicator" aria-live="polite">&nbsp;</div>
  <div class="player-controls">
    <button class="btn-skip" id="btnPrev" aria-label="Ejercicio anterior">&#9198;</button>
  <div class="timer-ring-container">
    <svg class="timer-ring" viewBox="0 0 150 150">
      <circle class="timer-ring-bg" cx="75" cy="75" r="68"/>
      <circle class="timer-ring-fg" id="timerRingFg" cx="75" cy="75" r="68" stroke="var(--blue)" stroke-dasharray="427.26" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text" id="timerText">40</div>
  </div>
    <button class="btn-skip" id="btnSkip" aria-label="Saltar ejercicio">&#9197;</button>
  </div>
</div>

<div id="previewScreen" class="screen">
  <div class="preview-top">
    <button class="btn-back" id="btnBack" aria-label="Volver">&#8592;</button>
    <div class="preview-title">Tu entreno</div>
  </div>
  <div class="preview-summary" id="previewSummary"></div>
  <div class="preview-list" id="previewList"></div>
  <div class="preview-actions">
    <button class="btn-secondary" id="btnShuffle">&#128256; Otro</button>
    <button class="btn-go" id="btnStart">EMPEZAR</button>
  </div>
</div>

<div id="finishScreen" class="screen">
  <div class="finish-trophy" id="finishTrophy">&#127942;</div>
  <div class="finish-text" id="finishText">Bien hecho<br>campeón!</div>
  <div class="finish-stats" id="finishStats"></div>
  <button class="btn-restart" id="btnRestart">Nuevo entreno</button>
</div>

<div class="pause-overlay" id="pauseOverlay">
  <div class="pause-title">Pausa</div>
  <button class="btn-resume" id="btnResume">Continuar</button>
  <button class="btn-quit" id="btnQuit">Terminar sesión</button>
</div>

<div class="confetti-container" id="confettiContainer"></div>

// ========== APP STATE ==========
const WORK_DURATION=40, REST_DURATION=30, SWITCH_DURATION=5;
const PREPARE_FIRST=5, PREPARE_AFTER_REST=5, PREPARE_DEFAULT=10;
const EXERCISES_PER_REST=5;
let state = { minutes:10, schedule:[], phases:[], phaseIndex:0, phaseEndAt:0, remainingMs:0, lastSecond:null, totalDuration:0, totalExercises:0, renderedItem:null, isPaused:false, running:false, tickId:null };

const $ = id => document.getElementById(id);
const homeScreen=$('homeScreen'), exerciseScreen=$('exerciseScreen'), finishScreen=$('finishScreen');
const minutesDisplay=$('minutesDisplay'), wheelCircle=$('wheelCircle');
const progressText=$('progressText'), progressBar=$('progressBar');
const exerciseIllustration=$('exerciseIllustration'), exerciseName=$('exerciseName');
const exerciseDesc=$('exerciseDesc'), sideIndicator=$('sideIndicator');
const timerRingFg=$('timerRingFg'), timerText=$('timerText');
const pauseOverlay=$('pauseOverlay'), finishStats=$('finishStats');
const confettiContainer=$('confettiContainer');

const CIRCUMFERENCE = 2*Math.PI*114;
const TIMER_CIRCUMFERENCE = 2*Math.PI*68;

function updateWheel(){
  wheelCircle.style.strokeDashoffset = CIRCUMFERENCE*(1-state.minutes/25);
  minutesDisplay.textContent = state.minutes;
}
$('btnMinus').addEventListener('click',()=>{ if(state.minutes>1){state.minutes--;updateWheel()} });
$('btnPlus').addEventListener('click',()=>{ if(state.minutes<25){state.minutes++;updateWheel()} });

let wheelDragging=false;
const wheelContainer=document.querySelector('.wheel-container');
function getAngleFromEvent(e){
  const rect=wheelContainer.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const cX=e.touches?e.touches[0].clientX:e.clientX;
  const cY=e.touches?e.touches[0].clientY:e.clientY;
  let angle=Math.atan2(cY-cy,cX-cx)+Math.PI/2;
  if(angle<0) angle+=2*Math.PI;
  return angle;
}
function handleWheelMove(e){
  if(!wheelDragging) return;
  e.preventDefault();
  state.minutes=Math.max(1,Math.min(25,Math.round(getAngleFromEvent(e)/(2*Math.PI)*25)));
  updateWheel();
}
wheelContainer.addEventListener('mousedown',()=>wheelDragging=true);
wheelContainer.addEventListener('touchstart',()=>wheelDragging=true,{passive:true});
document.addEventListener('mousemove',handleWheelMove);
document.addEventListener('touchmove',handleWheelMove,{passive:false});
document.addEventListener('mouseup',()=>wheelDragging=false);
document.addEventListener('touchend',()=>wheelDragging=false);
updateWheel();

// ========== ILLUSTRATION ==========
// An exercise can be used once it has a photo or a fallback drawing
function isAvailable(ex){ return ex.hasPhoto || !!EXERCISE_SVGS[ex.id] }

function fillIllustration(container, ex){
  if(ex.hasPhoto){
    const img = document.createElement('img');
    img.src = 'img/'+ex.id+'.jpg';
    img.alt = ex.name;
    img.onerror = function(){ container.innerHTML = EXERCISE_SVGS[ex.id]||''; };
    container.innerHTML = '';
    container.appendChild(img);
  } else {
    container.innerHTML = EXERCISE_SVGS[ex.id]||'';
  }
}

function renderIllustration(item){
  if(item.type==='rest'){
    exerciseIllustration.innerHTML = EXERCISE_SVGS.rest;
    return;
  }
  fillIllustration(exerciseIllustration, item.exercise);
}

// ========== WORKOUT GENERATION ==========
function pickExercise(group, used){
  const candidates=EXERCISES[group].filter(isAvailable);
  const unused=candidates.filter(ex=>!used.has(ex.id));
  const pool=unused.length?unused:candidates;
  const weighted=[];
  pool.forEach(ex=>{ for(let i=0;i<(ex.preferred?3:1);i++) weighted.push(ex) });
  return weighted[Math.floor(Math.random()*weighted.length)];
}

function exerciseDuration(ex){ return WORK_DURATION+(ex.unilateral?SWITCH_DURATION:0) }

function generateSchedule(totalMinutes){
  const totalSeconds=totalMinutes*60;
  const groups=['lower','upper','core'], used=new Set();
  let schedule=[], groupIndex=Math.floor(Math.random()*3), usedSeconds=0, exercisesSinceRest=0, prepare=PREPARE_FIRST;

  while(true){
    const group=groups[groupIndex%3];
    const exercise=pickExercise(group,used);
    const work=exerciseDuration(exercise);
    if(usedSeconds+prepare+work>totalSeconds) break;
    used.add(exercise.id);
    schedule.push({type:'exercise',exercise,group,prepare,work});
    usedSeconds+=prepare+work;
    exercisesSinceRest++;
    groupIndex++;
    prepare=PREPARE_DEFAULT;
    if(exercisesSinceRest>=EXERCISES_PER_REST && usedSeconds+REST_DURATION+PREPARE_AFTER_REST+WORK_DURATION<=totalSeconds){
      schedule.push({type:'rest',duration:REST_DURATION});
      usedSeconds+=REST_DURATION;
      exercisesSinceRest=0;
      prepare=PREPARE_AFTER_REST;
    }
  }
  if(schedule.length && schedule[schedule.length-1].type==='rest') schedule.pop();
  return schedule;
}

// Each exercise becomes timed phases: prepare -> work (unilateral: side 1 -> switch -> side 2)
function buildPhases(schedule){
  const phases=[];
  let exNum=0, offset=0;
  const add=p=>{ p.offset=offset; offset+=p.duration; phases.push(p) };
  schedule.forEach((item,i)=>{
    if(item.type==='rest'){ add({kind:'rest',duration:item.duration,item,itemIndex:i,next:schedule[i+1]}); return; }
    exNum++;
    const base={item,itemIndex:i,exNum};
    if(item.prepare>0) add({...base,kind:'prepare',duration:item.prepare});
    if(item.exercise.unilateral){
      add({...base,kind:'work',duration:WORK_DURATION/2,side:1});
      add({...base,kind:'switch',duration:SWITCH_DURATION});
      add({...base,kind:'work',duration:WORK_DURATION/2,side:2,last:true});
    } else {
      add({...base,kind:'work',duration:WORK_DURATION,last:true});
    }
  });
  return phases;
}

// ========== EVENTS & SOUND ==========
// The player only emits events; sound (and later, voice) reacts to them.
const listeners=[];
function onPlayerEvent(fn){ listeners.push(fn) }
function emit(type,data){ listeners.forEach(fn=>fn(type,data||{})) }

const Sound = {
  ctx:null,
  enabled:true,
  unlock(){
    try{
      if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) this.ctx=new AC(); }
      if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    }catch(e){}
  },
  tone(freq,dur,delay=0,vol=0.3){
    if(!this.enabled||!this.ctx) return;
    const t=this.ctx.currentTime+delay;
    const osc=this.ctx.createOscillator(), gain=this.ctx.createGain();
    osc.type='sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(vol,t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t+dur+0.05);
  }
};
try{ Sound.enabled=localStorage.getItem('kettlego.sound')!=='off' }catch(e){}

onPlayerEvent((type,data)=>{
  if(data.late) return;
  if(type==='countdown') Sound.tone(660,0.12);
  else if(type==='phaseStart'){
    const kind=data.phase.kind;
    if(kind==='work') Sound.tone(990,0.35);
    else if(kind==='switch'){ Sound.tone(880,0.12); Sound.tone(880,0.12,0.18); }
    else if(data.index>0) Sound.tone(440,0.4);
  }
  else if(type==='finish') [523,659,784,1047].forEach((f,i)=>Sound.tone(f,0.2,i*0.15));
});

const btnSound=$('btnSound');
function updateSoundButton(){
  btnSound.innerHTML=Sound.enabled?'&#128266;':'&#128263;';
  btnSound.setAttribute('aria-label',Sound.enabled?'Silenciar':'Activar sonido');
}
btnSound.addEventListener('click',()=>{
  Sound.enabled=!Sound.enabled;
  try{ localStorage.setItem('kettlego.sound',Sound.enabled?'on':'off') }catch(e){}
  Sound.unlock();
  updateSoundButton();
});
updateSoundButton();

// ========== SCREEN WAKE LOCK ==========
// Keeps the screen on during a session; the browser drops the lock when the tab is hidden
const WakeLock = {
  sentinel:null,
  async acquire(){
    try{
      if('wakeLock' in navigator && !this.sentinel){
        this.sentinel=await navigator.wakeLock.request('screen');
        this.sentinel.addEventListener('release',()=>{ this.sentinel=null });
      }
    }catch(e){}
  },
  async release(){
    try{ if(this.sentinel) await this.sentinel.release(); }catch(e){}
    this.sentinel=null;
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && state.running) WakeLock.acquire();
});

// ========== SESSION CONTROL ==========
function showScreen(s){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); s.classList.add('active') }

// ========== PREVIEW ==========
const previewScreen=$('previewScreen'), previewList=$('previewList'), previewSummary=$('previewSummary');
const GROUP_LABELS={lower:'Piernas',upper:'Tren superior',core:'Core'};

function scheduleSeconds(schedule){
  return schedule.reduce((s,i)=>s+(i.type==='rest'?i.duration:i.prepare+i.work),0);
}

function formatDuration(secs){
  const m=Math.floor(secs/60), s=secs%60;
  if(!m) return s+' s';
  return s?m+' min '+s+' s':m+' min';
}

function showPreview(){
  state.schedule=generateSchedule(state.minutes);
  renderPreview();
  showScreen(previewScreen);
  previewList.scrollTop=0;
}

// Same group and same sidedness, so the workout length doesn't change
function swapCandidates(index){
  const item=state.schedule[index];
  const used=new Set(state.schedule.filter(s=>s.type==='exercise').map(s=>s.exercise.id));
  return EXERCISES[item.group].filter(ex=>isAvailable(ex) && !used.has(ex.id) && ex.unilateral===item.exercise.unilateral);
}

function swapExercise(index){
  const candidates=swapCandidates(index);
  if(!candidates.length) return;
  state.schedule[index].exercise=candidates[Math.floor(Math.random()*candidates.length)];
  renderPreview();
}

function renderPreview(){
  const exerciseCount=state.schedule.filter(s=>s.type==='exercise').length;
  previewSummary.textContent=exerciseCount+' ejercicios · '+formatDuration(scheduleSeconds(state.schedule));
  previewList.innerHTML='';
  state.schedule.forEach((item,i)=>{
    const row=document.createElement('div');
    if(item.type==='rest'){
      row.className='preview-item rest';
      row.textContent='Descanso · '+item.duration+' s';
      previewList.appendChild(row);
      return;
    }
    row.className='preview-item';
    const thumb=document.createElement('div');
    thumb.className='preview-thumb';
    fillIllustration(thumb,item.exercise);
    const info=document.createElement('div');
    info.className='preview-info';
    const name=document.createElement('div');
    name.className='preview-name';
    name.textContent=item.exercise.name;
    const meta=document.createElement('div');
    meta.className='preview-meta';
    meta.innerHTML='<span class="tag '+item.group+'">'+GROUP_LABELS[item.group]+'</span>'+(item.exercise.unilateral?(WORK_DURATION/2)+' s por lado':WORK_DURATION+' s');
    info.append(name,meta);
    const swap=document.createElement('button');
    swap.className='btn-swap';
    swap.innerHTML='&#8635;';
    swap.setAttribute('aria-label','Cambiar '+item.exercise.name);
    swap.disabled=!swapCandidates(i).length;
    swap.addEventListener('click',()=>swapExercise(i));
    row.append(thumb,info,swap);
    previewList.appendChild(row);
  });
}

function startSession(){
  Sound.unlock();
  if(!state.schedule.length) return;
  state.phases=buildPhases(state.schedule);
  state.totalDuration=state.phases.reduce((s,p)=>s+p.duration,0);
  state.totalExercises=state.schedule.filter(s=>s.type==='exercise').length;
  state.renderedItem=null;
  state.isPaused=false;
  state.running=true;
  state.completed=new Set();
  state.startedAt=performance.now();
  state.pausedMs=0;
  WakeLock.acquire();
  showScreen(exerciseScreen);
  enterPhase(0,performance.now(),false);
  clearInterval(state.tickId);
  state.tickId=setInterval(tick,100);
}

function stopSession(){
  state.running=false;
  clearInterval(state.tickId);
  WakeLock.release();
}

function enterPhase(index,startAt,late){
  if(index>=state.phases.length){ finishSession(); return; }
  state.phaseIndex=index;
  const phase=state.phases[index];
  state.phaseEndAt=startAt+phase.duration*1000;
  state.lastSecond=null;
  renderPhase(phase);
  emit('phaseStart',{phase,index,late});
  updateTimerDisplay(phase.duration*1000);
}

// Time comes from the clock, not from counting ticks, so throttled tabs don't drift
function tick(){
  if(!state.running||state.isPaused) return;
  const now=performance.now();
  while(state.running && now>=state.phaseEndAt){
    const endedAt=state.phaseEndAt;
    const ended=state.phases[state.phaseIndex];
    if(ended.last) state.completed.add(ended.itemIndex);
    enterPhase(state.phaseIndex+1,endedAt,now-endedAt>1000);
  }
  if(!state.running) return;
  const remainingMs=state.phaseEndAt-now;
  const sec=Math.ceil(remainingMs/1000);
  if(sec!==state.lastSecond){
    state.lastSecond=sec;
    if(sec>=1 && sec<=3) emit('countdown',{seconds:sec});
  }
  updateTimerDisplay(remainingMs);
}

function renderPhase(phase){
  const item=phase.item;
  if(phase.kind==='rest'){
    progressText.textContent='Descanso';
    exerciseName.textContent='Descanso';
    exerciseDesc.textContent=phase.next&&phase.next.type==='exercise'?'Siguiente: '+phase.next.exercise.name:'Respira y recupérate';
    sideIndicator.innerHTML='&nbsp;';
    sideIndicator.className='side-indicator';
  } else {
    progressText.textContent=phase.exNum+' / '+state.totalExercises;
    exerciseName.textContent=item.exercise.name;
    exerciseDesc.textContent=item.exercise.desc;
    if(phase.kind==='prepare'){
      sideIndicator.textContent='Prepárate';
      sideIndicator.className='side-indicator prepare';
    } else if(phase.kind==='switch'){
      sideIndicator.textContent='Cambia de lado';
      sideIndicator.className='side-indicator change';
    } else if(phase.side){
      sideIndicator.textContent='Lado '+phase.side;
      sideIndicator.className='side-indicator '+(phase.side===1?'blue':'red');
    } else {
      sideIndicator.innerHTML='&nbsp;';
      sideIndicator.className='side-indicator';
    }
  }
  const shown=phase.kind==='rest'&&phase.next&&phase.next.type==='exercise'?phase.next:item;
  exerciseIllustration.classList.toggle('resting',phase.kind==='rest');
  if(state.renderedItem!==shown){
    state.renderedItem=shown;
    renderIllustration(shown);
  }
}

function phaseColor(phase,remainingMs){
  if(phase.kind==='rest') return 'var(--green)';
  if(phase.kind==='prepare'||phase.kind==='switch') return 'var(--accent2)';
  if(phase.side) return phase.side===1?'var(--blue)':'var(--red)';
  return remainingMs>3000?'var(--blue)':'var(--red)';
}

function updateTimerDisplay(remainingMs){
  const phase=state.phases[state.phaseIndex];
  const durationMs=phase.duration*1000;
  const clamped=Math.max(0,Math.min(durationMs,remainingMs));
  const pct=1-clamped/durationMs;
  const color=phaseColor(phase,clamped);

  timerRingFg.style.strokeDashoffset=TIMER_CIRCUMFERENCE*(1-pct);
  timerRingFg.style.stroke=color;
  timerText.style.color=color;
  timerText.textContent=Math.ceil(clamped/1000);

  const totalElapsed=phase.offset+(durationMs-clamped)/1000;
  progressBar.style.width=(totalElapsed/state.totalDuration*100)+'%';
}

// ========== SKIP / PREVIOUS ==========
function currentRemainingMs(){
  return state.isPaused?state.remainingMs:state.phaseEndAt-performance.now();
}

function jumpToItem(itemIndex){
  if(itemIndex>=state.schedule.length){ finishSession(); return; }
  const idx=state.phases.findIndex(p=>p.itemIndex===Math.max(0,itemIndex));
  enterPhase(idx,performance.now(),false);
}

function skipItem(){
  if(!state.running||state.isPaused) return;
  jumpToItem(state.phases[state.phaseIndex].itemIndex+1);
}

// Like a music player: restart the current item, or go back one if it just started
function previousItem(){
  if(!state.running||state.isPaused) return;
  const phase=state.phases[state.phaseIndex];
  const first=state.phases.find(p=>p.itemIndex===phase.itemIndex);
  const elapsed=phase.offset-first.offset+(phase.duration*1000-currentRemainingMs())/1000;
  jumpToItem(elapsed>3?phase.itemIndex:phase.itemIndex-1);
}

$('btnSkip').addEventListener('click',skipItem);
$('btnPrev').addEventListener('click',previousItem);

function pauseSession(){
  if(!state.running||state.isPaused) return;
  state.isPaused=true;
  state.pausedAt=performance.now();
  state.remainingMs=state.phaseEndAt-performance.now();
  pauseOverlay.classList.add('active');
}

function resumeSession(){
  if(!state.isPaused) return;
  Sound.unlock();
  state.phaseEndAt=performance.now()+state.remainingMs;
  state.pausedMs+=performance.now()-state.pausedAt;
  state.isPaused=false;
  pauseOverlay.classList.remove('active');
}

$('btnPause').addEventListener('click',pauseSession);
$('btnResume').addEventListener('click',resumeSession);
$('btnQuit').addEventListener('click',()=>{ stopSession(); state.isPaused=false; pauseOverlay.classList.remove('active'); showScreen(homeScreen) });

function finishSession(){
  stopSession();
  const activeSecs=Math.round((performance.now()-state.startedAt-state.pausedMs)/1000);
  const mostlyDone=state.completed.size*2>=state.totalExercises;
  $('finishTrophy').innerHTML=mostlyDone?'&#127942;':'&#128170;';
  $('finishText').innerHTML=mostlyDone?'Bien hecho<br>campeón!':'Buen intento,<br>¡a por la próxima!';
  finishStats.innerHTML=state.completed.size+' de '+state.totalExercises+' ejercicios completados<br>'+formatDuration(activeSecs)+' de entreno';
  showScreen(finishScreen);
  emit('finish');
  launchConfetti();
}

$('btnRestart').addEventListener('click',()=>{ confettiContainer.innerHTML=''; showScreen(homeScreen) });
$('btnGo').addEventListener('click',showPreview);
$('btnShuffle').addEventListener('click',showPreview);
$('btnBack').addEventListener('click',()=>showScreen(homeScreen));
$('btnStart').addEventListener('click',startSession);

function launchConfetti(){
  confettiContainer.innerHTML='';
  const colors=['#ff6b35','#ffd166','#06d6a0','#3a86ff','#ef476f','#fff'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.top='-10px';
    c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    c.style.width=(6+Math.random()*8)+'px';
    c.style.height=(6+Math.random()*8)+'px';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.style.transform='rotate('+Math.random()*360+'deg)';
    c.style.animation='confettiFall '+(1.5+Math.random()*2)+'s '+(Math.random()*1.5)+'s ease-out forwards';
    confettiContainer.appendChild(c);
  }
}

const style=document.createElement('style');
style.textContent='@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}';
document.head.appendChild(style);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
